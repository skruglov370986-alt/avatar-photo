<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AVATAR PHOTO • v0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#160d20;color:#fff;font:16px system-ui;display:flex;flex-direction:column;align-items:center;padding:12px 12px max(16px,env(safe-area-inset-bottom));gap:10px}header{width:min(100%,650px);display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:2px;color:#ff75ce}small{color:#c9b9d3}canvas{width:100%;height:100%;object-fit:contain;touch-action:none;display:block}#stage{width:min(100%,650px);height: min(58dvh,650px);background:#21182c;border:1px solid #60405f;border-radius:18px;overflow:hidden;position:relative}button,select,.file{border:1px solid #71446d;background:#32213e;color:white;padding:11px 13px;border-radius:12px;font:inherit;cursor:pointer}button.primary{background:#c01480;border-color:#ff73c9;font-weight:bold}button:disabled{opacity:.45} .bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(100%,650px)}label{display:flex;align-items:center;gap:6px;font-size:13px}input[type=range]{accent-color:#ed39ac;width:100px}#status{font-size:13px;color:#e3cce7;text-align:center;max-width:650px}#count{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;font-weight:bold;pointer-events:none;text-shadow:0 2px 12px black}#result{max-width:100%;max-height:60dvh;border-radius:12px}#review[hidden]{display:none}#review{width:min(100%,650px);text-align:center}video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}a{color:#ff9bda}.file input{display:none}</style></head><body>
<header><b>AVATAR PHOTO</b><small>WEB • v0.1</small></header><div id="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas" width="1080" height="1440"></canvas><div id="count"></div></div>
<div class="bar"><button class="primary" id="start">Включить камеру</button><button id="flip">↻ Камера</button><label class="file">Загрузить фото<input id="file" type="file" accept="image/*"></label></div>
<div class="bar"><label>Кадр <select id="ratio"><option value="3:4">3:4</option><option value="4:3">4:3</option><option value="9:16">9:16</option></select></label><label>Масштаб <input id="scale" type="range" min="0.4" max="1.8" value="0.95" step="0.01"></label><button id="reset">Сброс</button></div>
<div class="bar"><label><input id="snow" type="checkbox" checked> Снег</label><label><input id="overlay" type="checkbox" checked> Декор</label><label>Таймер <select id="timer"><option>0</option><option>3</option><option>5</option><option>10</option></select></label><button class="primary" id="shoot" disabled>● Снять фото</button></div>
<div id="status">Перетащите декорации пальцем. Для камеры откройте страницу через HTTPS. Можно также загрузить фото комнаты.</div><section id="review" hidden><img id="result" alt="Готовая фотография"><div class="bar"><button id="save">Скачать JPG</button><button id="share">Поделиться</button><button id="again">Новый кадр</button></div><small>На iPhone можно сохранить через меню «Поделиться» или удержание изображения.</small></section>
<script>
'use strict';const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d'),decor=new Image();decor.src='decor.png';let stream=null, facing='environment', photo=null, x=.5,y=.48, drag=null, blob=null,url=null,busy=false,seq=0;const particles=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,s:.02+Math.random()*.05}));let last=0;
function cover(img,w,h,mirror=false){let iw=img.videoWidth||img.naturalWidth,ih=img.videoHeight||img.naturalHeight;if(!iw||!ih)return;let k=Math.max(w/iw,h/ih);ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(img,(w-iw*k)/2,(h-ih*k)/2,iw*k,ih*k);ctx.restore()}
function render(t){let w=c.width,h=c.height,dt=Math.min(.05,(t-last)/1000||0);last=t;ctx.fillStyle='#24212b';ctx.fillRect(0,0,w,h);if(stream&&v.readyState>=2)cover(v,w,h,facing==='user');else if(photo)cover(photo,w,h);else{ctx.fillStyle='#34303c';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.5,h*.12);ctx.lineTo(w*.5,h*.72);ctx.lineTo(0,h*.92);ctx.fill();ctx.fillStyle='#49414c';ctx.beginPath();ctx.moveTo(w*.5,h*.12);ctx.lineTo(w,0);ctx.lineTo(w,h*.92);ctx.lineTo(w*.5,h*.72);ctx.fill();ctx.fillStyle='#27232d';ctx.beginPath();ctx.moveTo(0,h*.92);ctx.lineTo(w*.5,h*.72);ctx.lineTo(w,h*.92);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill()}
if($('overlay').checked&&decor.complete&&decor.naturalWidth){let k=Math.min(w/decor.width,h/decor.height)*Number($('scale').value),dw=decor.width*k,dh=decor.height*k;ctx.drawImage(decor,x*w-dw/2,y*h-dh/2,dw,dh)}if($('snow').checked){ctx.fillStyle='#fff';for(let p of particles){p.y=(p.y+p.s*dt)%1;ctx.globalAlpha=.25+p.r*.15;ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r*w/1080,0,7);ctx.fill()}ctx.globalAlpha=1}requestAnimationFrame(render)}requestAnimationFrame(render);
function stop(){seq++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}async function start(){stop();let token=seq;photo=null;$('shoot').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Камера недоступна. Откройте HTTPS-ссылку в Safari.');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});if(token!==seq){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;await v.play();if(token!==seq)return;$('shoot').disabled=false;$('status').textContent='Камера работает. Совместите подиум с полом, перетащите декор пальцем.'}catch(e){if(token!==seq)return;stop();$('status').textContent='Не удалось открыть камеру: '+e.message+' Проверьте разрешения Safari или загрузите фото.'}}
$('start').onclick=start;$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';start()};$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;stop();let token=seq;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);if(token!==seq)return;photo=im;$('shoot').disabled=false;$('status').textContent='Фото загружено. Настройте декорации и нажмите «Снять фото».'};im.onerror=()=>{URL.revokeObjectURL(u);$('status').textContent='Не удалось прочитать фото. Попробуйте JPG.'};im.src=u};
$('ratio').onchange=()=>{let [a,b]=$('ratio').value.split(':').map(Number);c.width=a>b?1440:1080;c.height=Math.round(c.width*b/a)};$('reset').onclick=()=>{x=.5;y=.48;$('scale').value=.95};function dims(){let r=c.getBoundingClientRect(),k=Math.min(r.width/c.width,r.height/c.height);return {w:c.width*k,h:c.height*k}}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x,y}};c.onpointermove=e=>{if(!drag)return;let d=dims();x=Math.max(-.5,Math.min(1.5,drag.x+(e.clientX-drag.px)/d.w));y=Math.max(-.5,Math.min(1.5,drag.y+(e.clientY-drag.py)/d.h))};c.onpointerup=c.onpointercancel=()=>drag=null;
$('shoot').onclick=async()=>{if(busy||(!photo&&(!stream||v.readyState<2)))return;busy=true;$('shoot').disabled=true;for(let n=Number($('timer').value);n>0;n--){$('count').textContent=n;await new Promise(r=>setTimeout(r,1000))}$('count').textContent='';if(!photo&&(!stream||v.readyState<2)){busy=false;return}c.toBlob(b=>{busy=false;$('shoot').disabled=false;if(!b)return;blob=b;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('result').src=url;$('review').hidden=false;$('review').scrollIntoView({behavior:'smooth'});},'image/jpeg',.94)};$('save').onclick=()=>{if(!url)return;let a=document.createElement('a');a.href=url;a.download='avatar-photo-'+Date.now()+'.jpg';a.click()};$('share').onclick=async()=>{if(!blob)return;let f=new File([blob],'avatar-photo.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else $('save').click()}catch(e){if(e.name!=='AbortError')$('status').textContent='Используйте кнопку «Скачать JPG».'}};$('again').onclick=()=>{$('review').hidden=true;window.scrollTo({top:0,behavior:'smooth'})};window.addEventListener('pagehide',stop);
</script></body></html>
